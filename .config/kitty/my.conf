### font ###

font_family    menlo
font_size      14
symbol_map     U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,
              \U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,
              \U+E5FA-U+E6B1,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,
              \U+F300-U+F372,U+F400-U+F532,U+F500-U+FD46,U+F0001-U+F1AF0
              \ Symbols Nerd Font Mono
# narrow_symbols U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,
#               \U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,
#               \U+E5FA-U+E6B1,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,
#               \U+F300-U+F372,U+F400-U+F532,U+F500-U+FD46,U+F0001-U+F1AF0
#               \ 1

text_composition_strategy 2.5 30

### cursor ###

cursor none
cursor_blink_interval 0

### color ###

foreground #24292f
background #ffffff

selection_foreground none
selection_background #ddf4ff

url_color #24292f

# normal
color0 #24292e
color1 #ff8182
color2 #4ac26b
color3 #d4a72c
color4 #54aeff
color5 #c297ff
color6 #76e3ea
color7 #6a737d

# bright
color8 #959da5
color9 #ffaba8
color10 #6fdd8b
color11 #eac54f
color12 #80ccff
color13 #d8b9ff
color14 #b3f0ff
color15 #d1d5da

### window ###

remember_window_size  no
# window size tooltip includes padding and margin
# this gives 80 chars per line, whereas tooltip says 82 cells
initial_window_width  78c
initial_window_height 25c
# resize_in_steps       yes

# window_border_width 2pt
# window_padding_width 10
window_margin_width 10

macos_titlebar_color background
# hide_window_decorations titlebar-only

### misc ###

confirm_os_window_close         0
enable_audio_bell               yes
scrollback_fill_enlarged_window yes
macos_option_as_alt             left
